services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: marketmaker
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: marketmaker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmaker -d marketmaker"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
